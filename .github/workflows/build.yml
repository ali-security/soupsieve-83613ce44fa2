name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest selector to run a subset of tests'
        required: false
        default: ''

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        # Seal: patch releases pinned to the release-era level; later CPython security releases changed html.parser iframe handling and break 8 iframe tests of this version.
        include:
          - tox-env: py37
            python-version: 3.7
            continue-on-error: false
          - tox-env: py38
            python-version: 3.8
            continue-on-error: false
          - tox-env: py39
            python-version: '3.9.13'
            continue-on-error: false
          - tox-env: py310
            python-version: '3.10.11'
            continue-on-error: false
          - tox-env: py311
            python-version: '3.11.3'
            continue-on-error: false
          - tox-env: nolxml
            python-version: '3.11.3'
            continue-on-error: false
          - tox-env: nohtml5lib
            python-version: '3.10.11'
            continue-on-error: false
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Package
      if: matrix.platform == 'ubuntu-22.04' && matrix.tox-env == 'py39'
      env:
        PIP_INDEX_URL: 'https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/'
      run: |
        echo 'hatchling==1.14.0' > "$RUNNER_TEMP/build-constraints.txt"
        export PIP_CONSTRAINT="$RUNNER_TEMP/build-constraints.txt"
        python -m build -s -w
    - name: Upload dists
      if: matrix.platform == 'ubuntu-22.04' && matrix.tox-env == 'py39'
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error
    - name: Test
      shell: bash
      run: |
        # Seal: drop the mypy type-check gate from tox's testenv commands (runs after the dists are built, so the packaged tox.ini is untouched).
        sed -i '/^ *mypy\r\{0,1\}$/d' tox.ini
        if [ -n "${{ inputs.test-filter }}" ]; then
          python -m pip install -r requirements/tests.txt -e .
          python -m pytest -rA ${{ inputs.test-filter }}
        else
          python -m tox
        fi

  lint:
    if: false
    timeout-minutes: 20
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.9]

    env:
      TOXENV: lint

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools tox
    - name: Lint
      run: |
        python -m tox

  documents:
    if: false
    timeout-minutes: 20
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.9]

    env:
      TOXENV: documents

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools tox
    - name: Install Aspell
      run: |
        sudo apt-get install aspell aspell-en
    - name: Build documents
      run: |
        python -m tox
